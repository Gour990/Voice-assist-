name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Unpack project files
        run: |
          python3 - <<'PY'
          import os, re
          text = open('bundle.txt', encoding='utf-8').read()
          parts = re.split(r'^=== FILE: (.+?) ===\n', text, flags=re.M)
          for i in range(1, len(parts), 2):
              path = os.path.join('project', parts[i].strip())
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(parts[i + 1])
          PY

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: project/app/build/outputs/apk/debug/app-debug.apk
